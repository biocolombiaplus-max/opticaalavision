<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel Óptica ALaVision</title>
<style>
  :root{
    --bg:#eef4f3; --surface:#fff; --surface-2:#e2ece9; --ink:#152e2a; --ink-soft:#45625c;
    --ink-faint:#7c9992; --accent:#0e7c74; --accent-strong:#0a5c56; --accent-tint:#e3f2ef;
    --gold:#a9772f; --gold-tint:#f6ecdb; --warn:#a8460b; --warn-tint:#fbe9dd; --border:#d3e2de;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--accent-strong);color:#fff;padding:14px 20px;font-weight:700;font-size:16px;}
  .shell{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 50px);}
  .leads{overflow-y:auto;border-right:1px solid var(--border);background:var(--surface);}
  .lead-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
  .lead-item:hover{background:var(--surface-2);}
  .lead-item.active{background:var(--accent-tint);}
  .lead-name{font-weight:700;font-size:14px;}
  .lead-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .badge{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--surface-2);color:var(--ink-soft);}
  .badge.alto{background:var(--accent-tint);color:var(--accent-strong);}
  .badge.humano{background:var(--warn-tint);color:var(--warn);}
  .conv{display:flex;flex-direction:column;height:100%;}
  .conv-header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .conv-header select, .conv-header button{font-family:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;}
  .conv-header button.primary{background:var(--accent);color:#fff;border:none;cursor:pointer;}
  .thread{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:60%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.4;}
  .msg.paciente{align-self:flex-start;background:var(--surface);border:1px solid var(--border);}
  .msg.agente{align-self:flex-end;background:var(--accent-tint);}
  .msg.humano{align-self:flex-end;background:var(--gold-tint);}
  .msg.sistema{align-self:center;background:var(--surface-2);font-size:12px;color:var(--ink-faint);}
  .msg-role{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px;}
  .composer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);}
  .composer input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;}
  .composer button{padding:10px 18px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;}
  .empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-faint);}
</style>
</head>
<body>
<header>Óptica ALaVision · Panel de conversaciones</header>
<div class="shell">
  <div class="leads" id="leads"></div>
  <div class="conv" id="conv"><div class="empty">Selecciona una conversación</div></div>
</div>
<script>
let currentId = null;
let pollTimer = null;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function badgeInteres(nivel) {
  return `<span class="badge ${nivel === 'alto' ? 'alto' : ''}">${nivel}</span>`;
}

function renderLeads(leads) {
  const el = document.getElementById('leads');
  el.innerHTML = leads.map(l => `
    <div class="lead-item ${l.id === currentId ? 'active' : ''}" data-id="${l.id}">
      <div class="lead-name">${l.nombre || l.wa_id}</div>
      <div class="lead-meta">${l.etapa} · ${new Date(l.actualizado_en).toLocaleString('es-CO')}</div>
      <div class="badges">
        ${badgeInteres(l.nivel_interes)}
        ${l.necesita_humano ? '<span class="badge humano">necesita humano</span>' : ''}
        ${l.ia_pausada ? '<span class="badge">IA pausada</span>' : ''}
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.lead-item').forEach(node => {
    node.addEventListener('click', () => openLead(Number(node.dataset.id)));
  });
}

async function loadLeads() {
  const leads = await api('/api/leads');
  renderLeads(leads);
}

function renderConv(lead, mensajes) {
  const el = document.getElementById('conv');
  el.innerHTML = `
    <div class="conv-header">
      <div><b>${lead.nombre || lead.wa_id}</b> — ${lead.wa_id}</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <select id="etapaSelect">
          ${['nuevo','calificando','propuesta_enviada','objecion','cita_agendada','ganado','perdido']
            .map(e => `<option value="${e}" ${e === lead.etapa ? 'selected' : ''}>${e}</option>`).join('')}
        </select>
        <button class="primary" id="pauseBtn">${lead.ia_pausada ? 'Reactivar IA' : 'Pausar IA'}</button>
      </div>
    </div>
    <div class="thread" id="thread">
      ${mensajes.map(m => `
        <div class="msg ${m.rol}">
          <div class="msg-role">${m.rol}</div>
          ${m.texto}
        </div>
      `).join('')}
    </div>
    <div class="composer">
      <input id="composerInput" placeholder="Escribir como asesor humano..." />
      <button id="sendBtn">Enviar</button>
    </div>
  `;
  document.getElementById('thread').scrollTop = 1e9;

  document.getElementById('etapaSelect').addEventListener('change', async (e) => {
    await api(`/api/leads/${lead.id}/etapa`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ etapa: e.target.value })
    });
    loadLeads();
  });

  document.getElementById('pauseBtn').addEventListener('click', async () => {
    await api(`/api/leads/${lead.id}/pausar`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ pausada: !lead.ia_pausada })
    });
    openLead(lead.id);
    loadLeads();
  });

  const send = async () => {
    const input = document.getElementById('composerInput');
    const texto = input.value.trim();
    if (!texto) return;
    input.value = '';
    await api(`/api/leads/${lead.id}/mensaje`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ texto })
    });
    openLead(lead.id);
  };
  document.getElementById('sendBtn').addEventListener('click', send);
  document.getElementById('composerInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') send();
  });
}

async function openLead(id) {
  currentId = id;
  const { lead, mensajes } = await api(`/api/leads/${id}`);
  renderConv(lead, mensajes);
  loadLeads();
}

loadLeads();
setInterval(() => {
  loadLeads();
  if (currentId) openLead(currentId);
}, 8000);
</script>
</body>
</html>
