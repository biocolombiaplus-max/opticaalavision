<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tienda — Óptica ALaVision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161f; --ink-soft:#4a4e5e; --ink-faint:#8b8f9e;
    --paper:#f6f6f3; --surface:#ffffff;
    --accent:#1f2a52; --accent-strong:#141b38;
    --gold:#b08d57; --gold-tint:#f3ebdd; --gold-strong:#8c6d3e;
    --line:#e4e2dc; --shadow: 0 1px 2px rgba(20,22,31,.04), 0 18px 40px -20px rgba(20,22,31,.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#edeef3; --ink-soft:#a9adbe; --ink-faint:#6b7080; --paper:#0e1016; --surface:#171a22;
      --accent:#8f9fe6; --accent-strong:#b3bff2; --gold:#d9b876; --gold-tint:#241f14; --gold-strong:#e9cd91;
      --line:#262a36; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -20px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --ink:#edeef3; --ink-soft:#a9adbe; --ink-faint:#6b7080; --paper:#0e1016; --surface:#171a22;
    --accent:#8f9fe6; --accent-strong:#b3bff2; --gold:#d9b876; --gold-tint:#241f14; --gold-strong:#e9cd91;
    --line:#262a36; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -20px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans",Arial,sans-serif;}
  h1,h2,.display{font-family:"Fraunces",serif;font-weight:600;letter-spacing:-.01em;}
  .mono{font-family:"IBM Plex Mono",monospace;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
  @media (max-width:720px){ .wrap{padding:0 20px;} }

  header.main{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--paper) 90%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
  .brand{display:flex;align-items:center;gap:10px;font-family:"Fraunces",serif;font-size:20px;font-weight:700;}
  .brand .mark{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .nav a.back{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .cart-btn{position:relative;background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:2px;font-weight:700;font-size:13.5px;cursor:pointer;}
  .cart-count{position:absolute;top:-8px;right:-8px;background:var(--gold);color:#1a1508;font-size:10.5px;font-weight:800;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

  .store-hero{padding:52px 0 30px;}
  .store-hero .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-strong);margin-bottom:10px;}
  .store-hero h1{font-size:clamp(28px,4vw,42px);}

  .filters{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:28px;}
  .chip{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding-bottom:70px;}
  @media (max-width:1000px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} }
  .card{background:var(--surface);border:1px solid var(--line);border-radius:2px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .card-img{aspect-ratio:1/1;background:linear-gradient(135deg,var(--gold-tint),var(--surface-2,var(--paper)));display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .card-img img{width:100%;height:100%;object-fit:cover;}
  .card-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card-brand{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;}
  .card-name{font-size:14.5px;font-weight:700;}
  .card-price{font-family:"IBM Plex Mono",monospace;font-size:16px;color:var(--accent-strong);margin-top:auto;padding-top:8px;}
  .card-add{margin-top:10px;background:var(--accent);color:#fff;border:none;padding:10px;border-radius:2px;font-weight:700;font-size:12.5px;cursor:pointer;}
  .empty-state{padding:80px 0;text-align:center;color:var(--ink-faint);}

  .cart-overlay{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:60;display:none;}
  .cart-overlay.open{display:block;}
  .cart-panel{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;background:var(--surface);z-index:61;
    transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);}
  .cart-panel.open{transform:translateX(0);}
  .cart-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .cart-items{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;}
  .cart-item{display:flex;gap:12px;align-items:center;}
  .cart-item img{width:52px;height:52px;object-fit:cover;border-radius:4px;background:var(--gold-tint);}
  .cart-item .info{flex:1;font-size:13px;}
  .cart-item .qty{display:flex;align-items:center;gap:6px;}
  .cart-item .qty button{width:22px;height:22px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;}
  .cart-foot{padding:18px 20px;border-top:1px solid var(--line);}
  .cart-total{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-bottom:14px;}
  .checkout-btn{width:100%;background:#25d366;color:#06210f;border:none;padding:14px;border-radius:2px;font-weight:800;font-size:14px;cursor:pointer;}
  .close-cart{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}
</style>
</head>
<body>

<header class="main">
  <div class="wrap nav">
    <a class="brand" href="/"><span class="mark">AV</span><span id="brandName">ALaVision</span></a>
    <a class="back" href="/">← Volver a la página principal</a>
    <button class="cart-btn" id="cartBtn">🛍 Carrito <span class="cart-count" id="cartCount" style="display:none;">0</span></button>
  </div>
</header>

<div class="wrap store-hero">
  <div class="eyebrow">Tienda</div>
  <h1>Nuestra colección completa</h1>
</div>

<div class="wrap filters" id="filters"></div>
<div class="wrap"><div class="grid" id="grid"></div></div>

<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-head"><b>Tu pedido</b><button class="close-cart" id="closeCart">✕</button></div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-total"><span>Total</span><span id="cartTotal">$0</span></div>
    <button class="checkout-btn" id="checkoutBtn">Finalizar pedido por WhatsApp</button>
  </div>
</div>

<script>
let productos = [];
let marcas = [];
let filtroMarca = null;
let cart = JSON.parse(localStorage.getItem('alavision_cart') || '[]');
let whatsappNumero = '';

function money(n) { return '$' + Number(n).toLocaleString('es-CO'); }
function saveCart() { localStorage.setItem('alavision_cart', JSON.stringify(cart)); renderCart(); }

async function api(path) { const r = await fetch(path); return r.json(); }

function renderFilters() {
  const el = document.getElementById('filters');
  el.innerHTML = ['Todas', ...marcas.map(m => m.nombre)].map(nombre => `
    <div class="chip ${(!filtroMarca && nombre==='Todas') || filtroMarca===nombre ? 'active' : ''}" data-marca="${nombre}">${nombre}</div>
  `).join('');
  el.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      filtroMarca = chip.dataset.marca === 'Todas' ? null : chip.dataset.marca;
      renderFilters(); renderGrid();
    });
  });
}

function renderGrid() {
  const el = document.getElementById('grid');
  const marcaById = Object.fromEntries(marcas.map(m => [m.id, m.nombre]));
  let list = productos;
  if (filtroMarca) list = list.filter(p => marcaById[p.marca_id] === filtroMarca);
  if (list.length === 0) {
    el.innerHTML = '';
    el.parentElement.innerHTML = '<div class="empty-state">Aún no hay productos cargados en esta categoría. Vuelve pronto 😊</div>';
    return;
  }
  el.innerHTML = list.map(p => `
    <div class="card">
      <div class="card-img">${(p.imagen_url || p.imagen_transparente_url) ? `<img src="${p.imagen_url || p.imagen_transparente_url}" alt="${p.nombre}"/>` : '👓'}</div>
      <div class="card-body">
        <div class="card-brand">${marcaById[p.marca_id] || p.categoria}</div>
        <div class="card-name">${p.nombre}</div>
        <div class="card-price">${money(p.precio)}</div>
        <button class="card-add" data-id="${p.id}">Agregar al carrito</button>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.card-add').forEach(btn => {
    btn.addEventListener('click', () => {
      const producto = productos.find(p => p.id === Number(btn.dataset.id));
      const existing = cart.find(i => i.id === producto.id);
      if (existing) existing.qty += 1;
      else cart.push({ id: producto.id, nombre: producto.nombre, precio: producto.precio, qty: 1 });
      saveCart();
      openCart();
    });
  });
}

function renderCart() {
  const items = document.getElementById('cartItems');
  const count = document.getElementById('cartCount');
  const totalEl = document.getElementById('cartTotal');
  const total = cart.reduce((s,i) => s + i.precio * i.qty, 0);
  const totalQty = cart.reduce((s,i) => s + i.qty, 0);
  count.style.display = totalQty > 0 ? 'flex' : 'none';
  count.textContent = totalQty;
  totalEl.textContent = money(total);
  items.innerHTML = cart.length === 0
    ? '<p style="color:var(--ink-faint);font-size:13px;">Tu carrito está vacío.</p>'
    : cart.map(i => `
      <div class="cart-item">
        <div class="info"><b>${i.nombre}</b><br/>${money(i.precio)}</div>
        <div class="qty">
          <button data-id="${i.id}" data-d="-1">−</button>
          <span>${i.qty}</span>
          <button data-id="${i.id}" data-d="1">+</button>
        </div>
      </div>
    `).join('');
  items.querySelectorAll('button[data-d]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = cart.find(i => i.id === Number(btn.dataset.id));
      item.qty += Number(btn.dataset.d);
      cart = cart.filter(i => i.qty > 0);
      saveCart();
    });
  });
}

function openCart() {
  document.getElementById('cartOverlay').classList.add('open');
  document.getElementById('cartPanel').classList.add('open');
}
function closeCart() {
  document.getElementById('cartOverlay').classList.remove('open');
  document.getElementById('cartPanel').classList.remove('open');
}
document.getElementById('cartBtn').addEventListener('click', openCart);
document.getElementById('closeCart').addEventListener('click', closeCart);
document.getElementById('cartOverlay').addEventListener('click', closeCart);

document.getElementById('checkoutBtn').addEventListener('click', () => {
  if (cart.length === 0) return;
  const lineas = cart.map(i => `• ${i.qty}x ${i.nombre} — ${money(i.precio * i.qty)}`).join('\n');
  const total = cart.reduce((s,i) => s + i.precio * i.qty, 0);
  const texto = `Hola, quiero hacer este pedido:\n${lineas}\n\nTotal: ${money(total)}`;
  const digits = whatsappNumero.replace(/\D/g, '');
  window.open(`https://wa.me/${digits}?text=${encodeURIComponent(texto)}`, '_blank');
});

async function init() {
  const [cfg, m, p] = await Promise.all([api('/api/config'), api('/api/marcas'), api('/api/productos')]);
  whatsappNumero = cfg.whatsapp_numero || '';
  if (cfg.logo_url) {
    document.getElementById('brandName').style.display = 'none';
    const img = document.createElement('img'); img.src = cfg.logo_url; img.style.height = '30px';
    document.querySelector('.brand').prepend(img);
  }
  marcas = m; productos = p;
  renderFilters(); renderGrid(); renderCart();
}
init();
</script>
</body>
</html>
